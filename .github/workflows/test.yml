name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  host:
    name: Querya Desktop ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The host versions the extension promises to work with (engines in
        # manifest.json). The tester emulates each one's RPC surface.
        host: ["0.4.19", "0.5.0"]
    services:
      db:
        # Pinned to a Querya release so a run does not change under you; raise it
        # together with the hosts you support. (`env` is not available here.)
        image: ghcr.io/queryahub/querya-testdb-redis:0.4.19
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # The tester only warns when the OS sandbox is missing, so a green run can
      # mean "never sandboxed". Make the runner able to sandbox, and fail here
      # if it still cannot: the manifest's permissions must be tested for real.
      - name: Enable the OS sandbox (bubblewrap)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 runners block unprivileged user namespaces with AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if ! bwrap --ro-bind / / /bin/true; then
            echo "::error::bubblewrap cannot start on this runner, so --sandbox would be skipped"
            exit 1
          fi

      - run: scripts/package.sh

      # Switch to QueryaHub/action-test-extension@v1 once it is published.
      # Until then the action is pinned to a commit, not to a moving branch.
      - uses: QueryaHub/Querya-Desktop/.github/actions/test-extension@33c8853ea97f22ed0dc626dca7ca6320cc6b066a
        with:
          extension-dir: dist
          target-version: ${{ matrix.host }}
          connect: '{"host":"127.0.0.1","port":6379}'
          query: GET querya:app:name
          table: querya:app:name
          sandbox: "true"

      # Warnings do not fail the tester, so look for the one that matters.
      - name: Fail if the plugin ran without the sandbox
        run: |
          if grep -q "OS sandbox is not available" querya-ext-test-junit.xml; then
            echo "::error::the plugin ran without isolation; --sandbox was not applied"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.host }}
          path: querya-ext-test-junit.xml
          if-no-files-found: error
